# Cloudflare Pages configuration.
#
# `[vars]` declares non-secret build/runtime environment variables.
# Cloudflare Pages reads this file at deploy time and surfaces the
# values to your runtime via `process.env`. Variables declared here
# survive rebuilds — that's the fix for the "Variables get wiped"
# behavior in the dashboard.
#
# IMPORTANT: Do NOT put secrets here. CF_D1_API_TOKEN is a credential
# and must remain a Cloudflare Pages encrypted secret (set via the
# dashboard's "Encrypted" variable type, or `wrangler pages secret put
# CF_D1_API_TOKEN`). Encrypted secrets are persisted server-side and
# never appear in this file or in the repo.
#
# The two IDs below are NOT secrets — they identify the Cloudflare
# account and D1 database. Anyone with them still needs the API token
# to read or write data. They're fine to commit to a public repo, but
# anyone forking the project will replace them with their own.
#
# Replace the placeholder values with the IDs from the Cloudflare
# dashboard (or `wrangler d1 list` output) before deploying.

name = "mathymath"
compatibility_date = "2025-05-01"

[vars]
CF_ACCOUNT_ID = "6a03df6158ac8a6dce8922a9915e61e7"
CF_D1_DATABASE_ID = "f30e473e-a09c-40d2-8919-09ffefac98eb"
